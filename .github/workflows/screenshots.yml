name: Capture app screenshots

# Captures real screenshots of the live, deployed app for the PWA manifest
# and app-store listings. Runs on GitHub's runners specifically because
# they can reach the live production URL and this repo's dev sandbox
# cannot (no database connectivity there to render a real dashboard) — see
# scripts/capture-screenshots.mjs for the capture logic.
#
# Manual trigger only, not on every push: screenshots reflect live mock
# data that drifts day to day, and store-listing screenshots don't need
# to be pixel-fresh — run this on demand when you want updated ones.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture screenshots from the live site
        run: node scripts/capture-screenshots.mjs

      - name: Upload screenshots as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sgbtracker-screenshots
          path: public/screenshots/*.png

      - name: Commit screenshots to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/screenshots
          git diff --cached --quiet && echo "No screenshot changes." || git commit -m "Update app screenshots (automated capture)"
          git push
